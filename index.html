<!doctype html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5efe9"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Needs"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png"><link rel="icon" type="image/png" href="assets/icon-192.png"><link rel="manifest" href="manifest.webmanifest"><title>Needs</title><style>:root{color-scheme:light;--text:#231f20;--muted:#6c625d;--soft:rgba(255,255,255,.52);--line:rgba(255,255,255,.58);--button:#231f20;--button-text:#fff;--bg:radial-gradient(circle at 4% 0%,rgba(255,205,174,.62),transparent 32%),radial-gradient(circle at 96% 14%,rgba(167,220,207,.55),transparent 30%),linear-gradient(145deg,#f8f0e9,#eef4ee 50%,#f6edf5)}[data-theme=dark]{color-scheme:dark;--text:#fffaf5;--muted:#c9c0b8;--soft:rgba(255,255,255,.08);--line:rgba(255,255,255,.12);--button:#fffaf5;--button-text:#1d1a18;--bg:radial-gradient(circle at 8% 0%,rgba(111,75,66,.45),transparent 32%),radial-gradient(circle at 96% 14%,rgba(47,89,84,.42),transparent 30%),linear-gradient(145deg,#151311,#18201e 52%,#211923)}*{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(255,255,255,.18),transparent 24%,rgba(255,255,255,.12))}button,input,select{font:inherit}button{border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}.app{width:min(100%,480px);min-height:100dvh;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 14px 104px}.topline{margin:0 0 7px;color:var(--muted);font-size:15px}h1{margin:0;max-width:12ch;font-size:clamp(27px,7.8vw,37px);line-height:1.05}h2{margin:0;font-size:20px}h3{margin:0;font-size:19px}.grid{display:grid;gap:10px;margin-top:16px}.grid.needs{grid-template-columns:1fr}.card,.need,.nav{border:1px solid var(--line);background:var(--soft);box-shadow:0 18px 52px rgba(55,49,45,.16);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}[data-theme=dark] .card,[data-theme=dark] .need,[data-theme=dark] .nav{box-shadow:0 18px 58px rgba(0,0,0,.38)}.card{border-radius:26px;padding:18px}.need{min-height:108px;width:100%;border-radius:25px;padding:14px;color:var(--text);text-align:left;transition:transform .18s}.need:active,.action:active{transform:scale(.99)}.need-body{background:linear-gradient(135deg,rgba(255,205,201,.68),rgba(255,237,202,.46))}.need-mind{background:linear-gradient(135deg,rgba(190,224,255,.66),rgba(198,239,220,.42))}.need-creativity{background:linear-gradient(135deg,rgba(244,196,255,.62),rgba(255,221,191,.42))}.need-connection{background:linear-gradient(135deg,rgba(211,239,166,.62),rgba(173,229,218,.42))}[data-theme=dark] .need{background:var(--soft)}.need-head,.between{display:flex;align-items:center;justify-content:space-between;gap:12px}.icon{display:grid;place-items:center;width:37px;height:37px;border-radius:14px;background:rgba(255,255,255,.48);font-weight:800}.percent{font-size:22px;font-weight:760;font-variant-numeric:tabular-nums}.need-name{margin:10px 0 0;font-size:clamp(19px,5.2vw,23px);font-weight:760}.label{margin:2px 0 0;color:var(--muted);font-size:14px;line-height:1.4}.bar{height:7px;margin-top:9px;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.48)}.bar span{display:block;height:100%;border-radius:inherit;background:rgba(35,31,32,.75)}[data-theme=dark] .bar span{background:rgba(255,255,255,.82)}.action{width:100%;border:1px solid var(--line);border-radius:24px;background:var(--soft);padding:16px;color:var(--text);text-align:left;box-shadow:0 10px 28px rgba(55,49,45,.1)}.action-title{margin:0;font-size:18px;font-weight:750}.action-meta{margin:5px 0 0;color:var(--muted);font-size:14px}.plus{display:grid;place-items:center;width:38px;height:38px;border-radius:999px;background:var(--button);color:var(--button-text);font-size:22px}.section{margin-top:14px}.primary,.soft{display:inline-flex;min-height:50px;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:0 18px;font-weight:760}.primary{width:100%;background:var(--button);color:var(--button-text);box-shadow:0 14px 30px rgba(35,31,32,.18)}.soft{background:var(--soft);color:var(--text)}.back{width:46px;height:46px;padding:0;margin-bottom:22px}.nav{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));z-index:10;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;width:min(calc(100% - 32px),448px);transform:translateX(-50%);border-radius:28px;padding:5px}.nav button{min-height:52px;border-radius:22px;background:transparent;color:var(--muted);font-size:12px;font-weight:700}.nav button.active{background:var(--button);color:var(--button-text)}.empty{display:grid;min-height:230px;place-items:center;text-align:center;color:var(--muted)}.history-day{margin-top:14px}.pill{border-radius:999px;background:rgba(255,255,255,.45);padding:7px 11px;color:var(--muted);font-size:13px;font-weight:760}.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.ring-item{display:grid;justify-items:center;gap:8px;color:var(--muted);font-size:12px;font-weight:700}.ring{--value:0;--ring-color:#ef9a9a;display:grid;width:56px;height:56px;place-items:center;border-radius:999px;background:conic-gradient(var(--ring-color) calc(var(--value)*1%),rgba(255,255,255,.48) 0);box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}.ring:after{content:attr(data-value) "%";display:grid;width:38px;height:38px;place-items:center;border-radius:inherit;background:rgba(255,255,255,.72);color:var(--text);font-size:12px;font-weight:800}[data-theme=dark] .ring:after{background:rgba(22,20,19,.85)}.status-good{color:#35624c}[data-theme=dark] .status-good{color:#9ee0b7}.action-group{padding:16px}.group-head{position:sticky;top:8px;z-index:1;margin:-4px -4px 12px;border-radius:21px;background:rgba(255,255,255,.42);padding:11px 12px;backdrop-filter:blur(18px)}[data-theme=dark] .group-head{background:rgba(255,255,255,.08)}.group-list{display:grid;gap:12px}.action-edit{border-radius:22px;background:rgba(255,255,255,.34);padding:1px 14px 14px}.action-edit-head{margin-top:12px}.remove-action{min-height:38px;border-radius:999px;background:rgba(255,255,255,.42);color:var(--muted);padding:0 12px;font-size:13px;font-weight:760}label{display:block;margin-top:15px;color:var(--muted);font-size:13px;font-weight:700;letter-spacing:.03em}input,select{width:100%;margin-top:8px;border:1px solid rgba(120,113,108,.18);border-radius:17px;background:rgba(255,255,255,.52);color:var(--text);padding:12px 13px;outline:none}input[type=range]{padding:0;accent-color:var(--button)}.danger{width:100%;margin-top:18px;background:rgba(255,255,255,.48);color:var(--text)}@media (min-width:720px){.app{width:min(100%,760px)}.grid.needs{grid-template-columns:repeat(2,1fr)}h1{max-width:14ch}}</style></head><body><main id="app" class="app"></main><nav class="nav" aria-label="Navigation"><button data-tab="today" class="active">Today</button><button data-tab="history">History</button><button data-tab="settings">Settings</button></nav><script>const app=document.getElementById("app"),storeKey="needs-standalone-v2",needOrder=["body","mind","creativity","connection"],needMeta={body:{name:"Body",label:"nourished",icon:"B"},mind:{name:"Mind",label:"calm",icon:"M"},creativity:{name:"Creativity",label:"alive",icon:"C"},connection:{name:"Connection",label:"held",icon:"H"}},defaultMorning={body:35,mind:45,creativity:25,connection:40},defaultActions=[["body-tea","body","Drink tea",8],["body-hygiene","body","Hygiene reset",12],["body-tai-chi","body","Tai Chi",15],["body-snack","body","Eat a mindful snack",10],["mind-breathe","mind","Breathe slowly",8],["mind-mantras","mind","Read mantras",10],["mind-pause","mind","Mindfulness pause",14],["mind-reflect","mind","Reflect without judging",12],["creativity-goal","creativity","Touch your main goal",15],["creativity-move","creativity","Make one tiny creative move",12],["creativity-sentence","creativity","Write one sentence",8],["creativity-space","creativity","Clean your creative space",10],["connection-message","connection","Send one kind message",10],["connection-outside","connection","Step outside and notice people",8],["connection-goal","connection","Do one social/creative goal",15],["connection-thank","connection","Thank someone silently",7]].map(([id,need,title,increase])=>({id,need,title,increase}));let state=load(),tab="today",selectedNeed=null;function dateKey(d=new Date){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}function freshToday(s){return{date:dateKey(),needs:{...s.morning},completions:[],gratitude:false}}function load(){const settings={morning:{...defaultMorning},actions:defaultActions,theme:"system"};try{const saved=JSON.parse(localStorage.getItem(storeKey)||"null");if(!saved)return{settings,today:freshToday(settings),history:[]};saved.settings={morning:{...settings.morning,...saved.settings?.morning},actions:saved.settings?.actions?.length?saved.settings.actions:defaultActions,theme:saved.settings?.theme||"system"};saved.history=saved.history||[];if(!saved.today||saved.today.date!==dateKey()){saved.today&&saved.history.unshift({date:saved.today.date,finalNeeds:{...saved.settings.morning,...saved.today.needs}});saved.history=saved.history.slice(0,60);saved.today=freshToday(saved.settings)}return saved}catch{return{settings,today:freshToday(settings),history:[]}}}function save(){localStorage.setItem(storeKey,JSON.stringify(state))}function clamp(v){return Math.max(0,Math.min(100,Math.round(Number(v)||0)))}function applyTheme(){const dark=state.settings.theme==="dark"||state.settings.theme==="system"&&matchMedia("(prefers-color-scheme: dark)").matches;document.documentElement.dataset.theme=dark?"dark":"light"}function render(){applyTheme();document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));if(tab==="history")return renderHistory();if(tab==="settings")return renderSettings();renderToday()}function renderToday(){if(selectedNeed){const actions=state.settings.actions.filter(a=>a.need===selectedNeed);app.innerHTML=`<button class="soft back" id="back">Back</button><p class="topline">Nourish</p><h1>${needMeta[selectedNeed].name}</h1><p class="label">Choose one gentle return.</p><section class="grid">${actions.map(actionTemplate).join("")}</section>`;document.getElementById("back").onclick=()=>{selectedNeed=null;render()};document.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>completeAction(state.settings.actions.find(a=>a.id===b.dataset.action)));return}app.innerHTML=`<h1>What do you need now?</h1><section class="grid needs">${needOrder.map(needTemplate).join("")}</section>`;document.querySelectorAll("[data-need]").forEach(b=>b.onclick=()=>{selectedNeed=b.dataset.need;render()})}function needTemplate(n){const v=state.today.needs[n],m=needMeta[n];return`<button class="need need-${n}" data-need="${n}"><div class="need-head"><span class="icon">${m.icon}</span><span class="percent">${v}%</span></div><p class="need-name">${m.name}</p><p class="label">${m.label}</p><div class="bar"><span style="width:${v}%"></span></div></button>`}function actionTemplate(a){return`<button class="action" data-action="${a.id}"><div class="between"><div><p class="action-title">${esc(a.title)}</p><p class="action-meta">${needMeta[a.need].name} - +${a.increase}%</p></div><span class="plus">+</span></div></button>`}function completeAction(a){state.today.needs[a.need]=clamp(state.today.needs[a.need]+a.increase);state.today.completions.unshift({id:Date.now()+"",actionId:a.id,title:a.title,need:a.need,increase:a.increase,completedAt:new Date().toISOString()});state.today.gratitude=state.today.gratitude||/thank|reflect|mantra/i.test(a.title);save();selectedNeed=null;tab="today";render()}function renderHistory(){app.innerHTML=`<h1>History</h1><p class="label">A simple look at whether previous days felt nourished enough.</p>${state.history.length?state.history.map(historyTemplate).join(""):`<section class="card section empty"><div><h2>Nothing archived yet</h2><p>At the next new day, yesterday will appear here.</p></div></section>`}`}function historyTemplate(day){const needs={...defaultMorning,...day.finalNeeds},ok=needs.body>=60&&needs.mind>=60&&needs.creativity>=50&&needs.connection>=60;return`<article class="card history-day"><div class="between"><h2>${day.date}</h2><span class="pill ${ok?"status-good":""}">${ok?"Befriedigt":"Noch weich"}</span></div><div class="rings">${needOrder.map(n=>ringTemplate(n,needs[n])).join("")}</div></article>`}function ringTemplate(n,v){const c={body:"#ef9a9a",mind:"#81c7df",creativity:"#d99be5",connection:"#90d7ae"};v=clamp(v);return`<div class="ring-item"><span class="ring" style="--value:${v};--ring-color:${c[n]}" data-value="${v}"></span><span>${needMeta[n].name}</span></div>`}function renderSettings(){app.innerHTML=`<h1>Settings</h1><p class="label">Shape the morning and the small returns.</p><section class="card section"><h2>Theme</h2><label>Mode<select id="theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label></section><section class="card section"><h2>Morning percentages</h2>${needOrder.map(n=>`<label>${needMeta[n].name}: <span id="value-${n}">${state.settings.morning[n]}%</span><input type="range" min="0" max="100" value="${state.settings.morning[n]}" data-default="${n}"></label>`).join("")}</section><section class="section"><div class="between"><h2>Actions</h2><button class="soft" id="restore">Restore</button></div><div class="grid">${needOrder.map(settingsActionGroupTemplate).join("")}</div></section><button class="primary danger" id="reset">Reset all data</button>`;theme.value=state.settings.theme;theme.onchange=e=>{state.settings.theme=e.target.value;save();render()};document.querySelectorAll("[data-default]").forEach(i=>i.oninput=()=>{state.settings.morning[i.dataset.default]=clamp(i.value);document.getElementById("value-"+i.dataset.default).textContent=state.settings.morning[i.dataset.default]+"%";save()});document.querySelectorAll("[data-action-field]").forEach(i=>i.onchange=()=>{const a=state.settings.actions.find(x=>x.id===i.dataset.actionId);if(!a)return;a[i.dataset.actionField]=i.dataset.actionField==="title"?i.value:clamp(i.value);save();render()});document.querySelectorAll("[data-delete-action]").forEach(b=>b.onclick=()=>{state.settings.actions=state.settings.actions.filter(a=>a.id!==b.dataset.deleteAction);save();render()});document.querySelectorAll("[data-add-action]").forEach(b=>b.onclick=()=>{const need=b.dataset.addAction;state.settings.actions.push({id:need+"-"+Date.now(),need,title:"New gentle return",increase:8});save();render()});restore.onclick=()=>{state.settings.actions=defaultActions.map(a=>({...a}));save();render()};reset.onclick=()=>{localStorage.removeItem(storeKey);state=load();tab="today";selectedNeed=null;render()}}function settingsActionTemplate(a){return`<article class="action-edit"><div class="between action-edit-head"><strong>${esc(a.title||"Untitled")}</strong><button class="remove-action" data-delete-action="${a.id}">Remove</button></div><label>Title<input value="${attr(a.title)}" data-action-id="${a.id}" data-action-field="title"></label><label>Increase<input type="number" min="0" max="100" value="${a.increase}" data-action-id="${a.id}" data-action-field="increase"></label></article>`}function settingsActionGroupTemplate(n){const actions=state.settings.actions.filter(a=>a.need===n);return`<article class="card action-group"><div class="between group-head"><h3>${needMeta[n].name}</h3><button class="soft" data-add-action="${n}">Add</button></div>${actions.length?`<div class="group-list">${actions.map(settingsActionTemplate).join("")}</div>`:`<p class="label">No actions here yet.</p>`}</article>`}function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}function attr(v){return esc(v).replace(/`/g,"&#096;")}document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;selectedNeed=null;render()});matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyTheme);render();</script></body></html>
