<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5efe9" />
    <title>Needs</title>
    <style>
      :root {
        color-scheme: light;
        --text: #231f20;
        --muted: #6c625d;
        --soft: rgba(255, 255, 255, 0.52);
        --line: rgba(255, 255, 255, 0.58);
        --button: #231f20;
        --button-text: #fff;
        --shadow: 0 18px 52px rgba(55, 49, 45, 0.16);
        --bg:
          radial-gradient(circle at 4% 0%, rgba(255, 205, 174, 0.62), transparent 32%),
          radial-gradient(circle at 96% 14%, rgba(167, 220, 207, 0.55), transparent 30%),
          linear-gradient(145deg, #f8f0e9 0%, #eef4ee 50%, #f6edf5 100%);
      }

      [data-theme="dark"] {
        color-scheme: dark;
        --text: #fffaf5;
        --muted: #c9c0b8;
        --soft: rgba(255, 255, 255, 0.08);
        --line: rgba(255, 255, 255, 0.12);
        --button: #fffaf5;
        --button-text: #1d1a18;
        --shadow: 0 18px 58px rgba(0, 0, 0, 0.38);
        --bg:
          radial-gradient(circle at 8% 0%, rgba(111, 75, 66, 0.45), transparent 32%),
          radial-gradient(circle at 96% 14%, rgba(47, 89, 84, 0.42), transparent 30%),
          linear-gradient(145deg, #151311 0%, #18201e 52%, #211923 100%);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(to bottom, rgba(255,255,255,0.18), transparent 24%, rgba(255,255,255,0.12));
      }

      button, input, select { font: inherit; }
      button { border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }

      .app {
        width: min(100%, 480px);
        min-height: 100dvh;
        margin: 0 auto;
        padding: max(22px, env(safe-area-inset-top)) 16px 112px;
      }

      .topline { margin: 0 0 7px; color: var(--muted); font-size: 15px; }
      h1 { margin: 0; max-width: 11ch; font-size: clamp(32px, 9.4vw, 42px); line-height: 1.04; letter-spacing: 0; }
      h2 { margin: 0; font-size: 20px; }
      h3 { margin: 0; font-size: 19px; }
      p { line-height: 1.45; }

      .grid { display: grid; gap: 12px; margin-top: 22px; }
      .grid.needs { grid-template-columns: 1fr; }
      .card, .need, .nav {
        border: 1px solid var(--line);
        background: var(--soft);
        box-shadow: var(--shadow);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
      }
      .card { border-radius: 26px; padding: 18px; }
      .need {
        min-height: 146px;
        width: 100%;
        border-radius: 27px;
        padding: 17px;
        color: var(--text);
        text-align: left;
        transition: transform 180ms ease;
      }
      .need:active, .action:active { transform: scale(0.99); }
      .need-body { background: linear-gradient(135deg, rgba(255, 205, 201, 0.68), rgba(255, 237, 202, 0.46)); }
      .need-mind { background: linear-gradient(135deg, rgba(190, 224, 255, 0.66), rgba(198, 239, 220, 0.42)); }
      .need-creativity { background: linear-gradient(135deg, rgba(244, 196, 255, 0.62), rgba(255, 221, 191, 0.42)); }
      .need-connection { background: linear-gradient(135deg, rgba(211, 239, 166, 0.62), rgba(173, 229, 218, 0.42)); }
      [data-theme="dark"] .need { background: var(--soft); }

      .need-head, .row, .between { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
      .icon {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: 17px;
        background: rgba(255, 255, 255, 0.48);
        color: var(--text);
        font-weight: 800;
      }
      [data-theme="dark"] .icon { background: rgba(255, 255, 255, 0.1); }
      .percent { font-size: 25px; font-weight: 760; font-variant-numeric: tabular-nums; }
      .need-name { margin: 17px 0 0; font-size: clamp(20px, 5.7vw, 24px); font-weight: 760; overflow-wrap: anywhere; }
      .label { margin: 3px 0 0; color: var(--muted); font-size: 15px; }
      .bar { height: 8px; margin-top: 14px; overflow: hidden; border-radius: 999px; background: rgba(255, 255, 255, 0.48); }
      [data-theme="dark"] .bar { background: rgba(255, 255, 255, 0.12); }
      .bar span { display: block; height: 100%; border-radius: inherit; background: rgba(35, 31, 32, 0.75); }
      [data-theme="dark"] .bar span { background: rgba(255, 255, 255, 0.82); }

      .action {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--soft);
        padding: 16px;
        color: var(--text);
        text-align: left;
        box-shadow: 0 10px 28px rgba(55, 49, 45, 0.1);
      }
      .action-title { margin: 0; font-size: 18px; font-weight: 750; }
      .action-meta { margin: 5px 0 0; color: var(--muted); font-size: 14px; }
      .plus { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 999px; background: var(--button); color: var(--button-text); font-size: 22px; }

      .section { margin-top: 16px; }
      .check { justify-content: flex-start; margin-top: 13px; color: var(--muted); }
      .box {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.48);
        color: transparent;
        font-weight: 800;
      }
      .box.on { background: var(--button); color: var(--button-text); }
      .good-day {
        margin: 18px 0 0;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.48);
        padding: 13px;
        text-align: center;
        font-size: 18px;
        font-weight: 760;
      }

      .primary, .soft {
        display: inline-flex;
        min-height: 52px;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: 999px;
        padding: 0 18px;
        font-weight: 760;
      }
      .primary { width: 100%; background: var(--button); color: var(--button-text); box-shadow: 0 14px 30px rgba(35, 31, 32, 0.18); }
      .soft { background: var(--soft); color: var(--text); }
      .back { width: 46px; height: 46px; padding: 0; margin-bottom: 22px; }

      .saved-note { color: var(--muted); font-weight: 720; }

      .nav {
        position: fixed;
        left: 50%;
        bottom: max(16px, env(safe-area-inset-bottom));
        z-index: 10;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 5px;
        width: min(calc(100% - 32px), 448px);
        transform: translateX(-50%);
        border-radius: 28px;
        padding: 5px;
      }
      .nav button {
        min-height: 52px;
        border-radius: 22px;
        background: transparent;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }
      .nav button.active { background: var(--button); color: var(--button-text); }

      .empty { display: grid; min-height: 230px; place-items: center; text-align: center; color: var(--muted); }
      .history-day { margin-top: 14px; }
      .pill { border-radius: 999px; background: rgba(255,255,255,0.45); padding: 7px 11px; color: var(--muted); font-size: 13px; }
      .action-group { padding: 16px; }
      .group-head {
        position: sticky;
        top: 8px;
        z-index: 1;
        margin: -4px -4px 12px;
        border-radius: 21px;
        background: rgba(255, 255, 255, 0.42);
        padding: 11px 12px;
        backdrop-filter: blur(18px);
      }
      [data-theme="dark"] .group-head { background: rgba(255, 255, 255, 0.08); }
      .group-list { display: grid; gap: 12px; }
      .action-edit {
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.34);
        padding: 1px 14px 14px;
      }
      [data-theme="dark"] .action-edit { background: rgba(255, 255, 255, 0.06); }
      .mini-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; margin-top: 15px; }
      .mini { border-radius: 18px; background: rgba(255,255,255,0.36); padding: 11px; }
      .mini small { color: var(--muted); }
      .mini strong { display: block; margin-top: 2px; font-size: 18px; }

      label { display: block; margin-top: 15px; color: var(--muted); font-size: 13px; font-weight: 700; letter-spacing: 0.03em; }
      input, select {
        width: 100%;
        margin-top: 8px;
        border: 1px solid rgba(120, 113, 108, 0.18);
        border-radius: 17px;
        background: rgba(255,255,255,0.52);
        color: var(--text);
        padding: 12px 13px;
        outline: none;
      }
      [data-theme="dark"] input, [data-theme="dark"] select { background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.12); }
      input[type="range"] { padding: 0; accent-color: var(--button); }
      .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .danger { width: 100%; margin-top: 18px; background: rgba(255,255,255,0.48); color: var(--text); }

      @media (max-width: 390px) {
        .app { padding-left: 13px; padding-right: 13px; }
        .grid.needs { gap: 10px; }
        .need { min-height: 134px; padding: 14px; border-radius: 24px; }
        .icon { width: 40px; height: 40px; border-radius: 15px; }
        .need-head { gap: 8px; }
        .need-name { margin-top: 14px; }
        .percent { font-size: 23px; }
        .label { font-size: 14px; }
        .card { padding: 16px; }
        .action-title { font-size: 17px; }
      }

      @media (min-width: 720px) {
        .app { width: min(100%, 760px); }
        .grid.needs { grid-template-columns: repeat(2, 1fr); }
        h1 { max-width: 14ch; }
      }
    </style>
  </head>
  <body>
    <main id="app" class="app"></main>
    <nav class="nav" aria-label="Navigation">
      <button data-tab="today" class="active">Today</button>
      <button data-tab="history">History</button>
      <button data-tab="settings">Settings</button>
    </nav>

    <script>
      const app = document.getElementById("app");
      const storeKey = "needs-standalone-v1";
      const needOrder = ["body", "mind", "creativity", "connection"];
      const needMeta = {
        body: { name: "Body", label: "nourished", icon: "B" },
        mind: { name: "Mind", label: "calm", icon: "M" },
        creativity: { name: "Creativity", label: "alive", icon: "C" },
        connection: { name: "Connection", label: "held", icon: "H" }
      };
      const defaultMorning = { body: 35, mind: 45, creativity: 25, connection: 40 };
      const defaultActions = [
        ["body-tea", "body", "Drink tea", 2, 8, "Let warmth arrive slowly. No rush, just a small return to your body."],
        ["body-hygiene", "body", "Hygiene reset", 5, 12, "Wash, brush, change, or refresh one simple thing with kindness."],
        ["body-tai-chi", "body", "Tai Chi", 7, 15, "Move gently and let your attention follow your breath."],
        ["body-snack", "body", "Eat a mindful snack", 5, 10, "Choose something small and notice the first few bites."],
        ["mind-breathe", "mind", "Breathe slowly", 2, 8, "Soften your shoulders. Count a few easy breaths."],
        ["mind-mantras", "mind", "Read mantras", 3, 10, "Read words that help you return to steadiness."],
        ["mind-pause", "mind", "Mindfulness pause", 5, 14, "Notice what is here without needing to fix it."],
        ["mind-reflect", "mind", "Reflect without judging", 5, 12, "Name what is true right now, gently and plainly."],
        ["creativity-goal", "creativity", "Touch your main goal", 10, 15, "Open the thread of what matters and touch it lightly."],
        ["creativity-move", "creativity", "Make one tiny creative move", 7, 12, "One sketch, one note, one adjustment. Small counts."],
        ["creativity-sentence", "creativity", "Write one sentence", 3, 8, "Let a single sentence be enough for now."],
        ["creativity-space", "creativity", "Clean your creative space", 5, 10, "Clear one surface or arrange one tool so returning feels easier."],
        ["connection-message", "connection", "Send one kind message", 3, 10, "Reach toward someone with one warm, honest line."],
        ["connection-outside", "connection", "Step outside and notice people", 5, 8, "Let the world be nearby for a moment."],
        ["connection-goal", "connection", "Do one social/creative goal", 10, 15, "Touch a shared or expressive intention with care."],
        ["connection-thank", "connection", "Thank someone silently", 2, 7, "Bring one person to mind and let gratitude be felt."]
      ].map(([id, need, title, minutes, increase, description]) => ({ id, need, title, minutes, increase, description }));

      let state = load();
      let tab = "today";
      let selectedNeed = null;
      let toast = "";

      function dateKey(date = new Date()) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, "0");
        const d = String(date.getDate()).padStart(2, "0");
        return `${y}-${m}-${d}`;
      }

      function freshToday(settings) {
        return { date: dateKey(), needs: { ...settings.morning }, completions: [], gratitude: false };
      }

      function load() {
        const settings = { morning: { ...defaultMorning }, actions: defaultActions, theme: "system" };
        try {
          const saved = JSON.parse(localStorage.getItem(storeKey) || "null");
          if (!saved) return { settings, today: freshToday(settings), history: [] };
          saved.settings = {
            morning: { ...settings.morning, ...(saved.settings && saved.settings.morning) },
            actions: saved.settings && saved.settings.actions && saved.settings.actions.length ? saved.settings.actions : defaultActions,
            theme: saved.settings && saved.settings.theme ? saved.settings.theme : "system"
          };
          saved.history = saved.history || [];
          if (!saved.today || saved.today.date !== dateKey()) {
            if (saved.today) {
              saved.history.unshift({
                date: saved.today.date,
                completions: saved.today.completions || [],
                finalNeeds: { ...saved.settings.morning, ...saved.today.needs }
              });
              saved.history = saved.history.slice(0, 60);
            }
            saved.today = freshToday(saved.settings);
          }
          return saved;
        } catch {
          return { settings, today: freshToday(settings), history: [] };
        }
      }

      function save() {
        localStorage.setItem(storeKey, JSON.stringify(state));
      }

      function applyTheme() {
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const dark = state.settings.theme === "dark" || (state.settings.theme === "system" && prefersDark);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      }

      function clamp(value) {
        return Math.max(0, Math.min(100, Math.round(Number(value) || 0)));
      }

      function gratitudeTitle(title) {
        return /thank|reflect|mantra/i.test(title);
      }

      function render() {
        applyTheme();
        document.querySelectorAll(".nav button").forEach((button) => button.classList.toggle("active", button.dataset.tab === tab));
        if (tab === "history") return renderHistory();
        if (tab === "settings") return renderSettings();
        renderToday();
      }

      function renderToday() {
        if (selectedNeed) {
          const actions = state.settings.actions.filter((action) => action.need === selectedNeed);
          app.innerHTML = `
            <button class="soft back" id="back">Back</button>
            <p class="topline">Nourish</p>
            <h1>${needMeta[selectedNeed].name}</h1>
            <p class="label">Choose one gentle return.</p>
            <section class="grid">${actions.map(actionTemplate).join("")}</section>
          `;
          document.getElementById("back").onclick = () => { selectedNeed = null; render(); };
          document.querySelectorAll("[data-action]").forEach((button) => {
            button.onclick = () => completeAction(state.settings.actions.find((action) => action.id === button.dataset.action));
          });
          return;
        }

        app.innerHTML = `
          <h1>What do you need now?</h1>
          ${toast ? `<section class="card section saved-note">${escapeHtml(toast)}</section>` : ""}
          <section class="grid needs">${needOrder.map(needTemplate).join("")}</section>
          <section class="card section">
            <h2>Today's gentle returns</h2>
            ${state.today.completions.length ? state.today.completions.slice(0, 5).map((item) => `<p class="label">${escapeHtml(item.title)} · ${needMeta[item.need].name}</p>`).join("") : `<p class="label">No returns saved yet. One small pause can be enough.</p>`}
          </section>
        `;
        document.querySelectorAll("[data-need]").forEach((button) => {
          button.onclick = () => { selectedNeed = button.dataset.need; render(); };
        });
      }

      function needTemplate(need) {
        const value = state.today.needs[need];
        const meta = needMeta[need];
        return `
          <button class="need need-${need}" data-need="${need}">
            <div class="need-head">
              <span class="icon">${meta.icon}</span>
              <span class="percent">${value}%</span>
            </div>
            <p class="need-name">${meta.name}</p>
            <p class="label">${meta.label}</p>
            <div class="bar"><span style="width:${value}%"></span></div>
          </button>
        `;
      }

      function actionTemplate(action) {
        return `
          <button class="action" data-action="${action.id}">
            <div class="between">
              <div>
                <p class="action-title">${escapeHtml(action.title)}</p>
                <p class="action-meta">${needMeta[action.need].name} · +${action.increase}%</p>
              </div>
              <span class="plus">+</span>
            </div>
          </button>
        `;
      }

      function checkTemplate(label, on) {
        return `<div class="row check"><span class="box ${on ? "on" : ""}">✓</span><span>${label}</span></div>`;
      }

      function completeAction(action) {
        const completion = {
          id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
          actionId: action.id,
          title: action.title,
          need: action.need,
          increase: action.increase,
          completedAt: new Date().toISOString()
        };
        state.today.needs[action.need] = clamp(state.today.needs[action.need] + action.increase);
        state.today.completions.unshift(completion);
        state.today.gratitude = state.today.gratitude || gratitudeTitle(action.title);
        toast = `${action.title} saved.`;
        save();
        selectedNeed = null;
        tab = "today";
        render();
      }

      function renderHistory() {
        app.innerHTML = `
          <h1>History</h1>
          <p class="label">Small returns from previous days.</p>
          ${state.history.length ? state.history.map(historyTemplate).join("") : `<section class="card section empty"><div><h2>Nothing archived yet</h2><p>At the next new day, today will be kept here gently.</p></div></section>`}
        `;
      }

      function historyTemplate(day) {
        return `
          <article class="card history-day">
            <div class="between"><h2>${day.date}</h2><span class="pill">${day.completions.length} returns</span></div>
            <div class="mini-grid">
              ${needOrder.map((need) => `<div class="mini"><small>${needMeta[need].name}</small><strong>${day.finalNeeds[need]}%</strong></div>`).join("")}
            </div>
            ${day.completions.length ? day.completions.map((item) => `<p class="label">${escapeHtml(item.title)} · +${item.increase}%</p>`).join("") : `<p class="label">A quiet day, still held.</p>`}
          </article>
        `;
      }

      function renderSettings() {
        app.innerHTML = `
          <h1>Settings</h1>
          <p class="label">Shape the morning and the small returns.</p>
          <section class="card section">
            <h2>Theme</h2>
            <label>Mode
              <select id="theme">
                <option value="system">System</option>
                <option value="light">Light</option>
                <option value="dark">Dark</option>
              </select>
            </label>
          </section>
          <section class="card section">
            <h2>Morning percentages</h2>
            ${needOrder.map((need) => `
              <label>${needMeta[need].name}: <span id="value-${need}">${state.settings.morning[need]}%</span>
                <input type="range" min="0" max="100" value="${state.settings.morning[need]}" data-default="${need}">
              </label>
            `).join("")}
          </section>
          <section class="section">
            <div class="between"><h2>Actions</h2><button class="soft" id="restore">Restore</button></div>
            <div class="grid">${needOrder.map(settingsActionGroupTemplate).join("")}</div>
          </section>
          <button class="primary danger" id="reset">Reset all data</button>
        `;
        document.getElementById("theme").value = state.settings.theme;
        document.getElementById("theme").onchange = (event) => {
          state.settings.theme = event.target.value;
          save();
          render();
        };
        document.querySelectorAll("[data-default]").forEach((input) => {
          input.oninput = () => {
            state.settings.morning[input.dataset.default] = clamp(input.value);
            document.getElementById(`value-${input.dataset.default}`).textContent = `${state.settings.morning[input.dataset.default]}%`;
            save();
          };
        });
        document.querySelectorAll("[data-action-field]").forEach((input) => {
          input.onchange = () => {
            const action = state.settings.actions.find((item) => item.id === input.dataset.actionId);
            const field = input.dataset.actionField;
            action[field] = field === "title" ? input.value : clamp(input.value);
            save();
          };
        });
        document.getElementById("restore").onclick = () => {
          state.settings.actions = defaultActions.map((action) => ({ ...action }));
          save();
          render();
        };
        document.getElementById("reset").onclick = () => {
          localStorage.removeItem(storeKey);
          state = load();
          tab = "today";
          selectedNeed = null;
          render();
        };
      }

      function settingsActionTemplate(action) {
        return `
          <article class="action-edit">
            <label>Title
              <input value="${escapeAttr(action.title)}" data-action-id="${action.id}" data-action-field="title">
            </label>
            <label>Increase
              <input type="number" min="0" max="100" value="${action.increase}" data-action-id="${action.id}" data-action-field="increase">
            </label>
          </article>
        `;
      }

      function settingsActionGroupTemplate(need) {
        const actions = state.settings.actions.filter((action) => action.need === need);
        return `
          <article class="card action-group">
            <div class="between group-head">
              <h3>${needMeta[need].name}</h3>
              <span class="pill">${actions.length} actions</span>
            </div>
            <div class="group-list">
              ${actions.map(settingsActionTemplate).join("")}
            </div>
          </article>
        `;
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[char]));
      }

      function escapeAttr(value) {
        return escapeHtml(value).replace(/`/g, "&#096;");
      }

      document.querySelectorAll(".nav button").forEach((button) => {
        button.onclick = () => {
          tab = button.dataset.tab;
          selectedNeed = null;
          render();
        };
      });
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
      render();
    </script>
  </body>
</html>
